[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fla2anim"
version = "0.1.1"
description = "Convert XFL-based Flash projects (CS5+ .fla / .xfl) to Pencil2D, Synfig, SWF and image sequences for OpenToonz / Harmony"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["Pillow>=10.1"]
keywords = ["flash", "fla", "xfl", "pencil2d", "synfig", "opentoonz", "harmony", "swf", "animation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.scripts]
fla2anim = "fla2anim.cli:main"

[tool.setuptools.packages.find]
include = ["fla2anim*"]
